#version: '3.8'

services:
  env_server:
    build: .
    container_name: minigrid_server
    command: python src/server.py
    # Expose le port pour que le conteneur trainer y accède
    expose:
      - "8000"

  trainer:
    build: .
    container_name: minigrid_trainer
    # Lancer les étapes manuellement (voir README — section "Lancer le projet")
    command: sleep infinity
    depends_on:
      - env_server
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      