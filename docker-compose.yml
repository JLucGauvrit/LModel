services:

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: minigrid_trainer
    command: python src/train_all.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./runs:/app/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
        - path: ./requirements.trainer.txt
          action: rebuild
        - path: .env
          action: sync+restart
          target: /app/.env

  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: minigrid_tensorboard
    command: tensorboard --logdir /app/runs --host 0.0.0.0 --port 6006 --load_fast=false --path_prefix /tensorboard
    volumes:
      - ./runs:/app/runs

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    container_name: minigrid_inference
    env_file: .env
    environment:
      CUDA_VISIBLE_DEVICES: "1"   # RTX 2060 SUPER uniquement (override .env)
    volumes:
      - ./checkpoints:/app/checkpoints:ro   # modèles en lecture seule
      - ./data:/app/data                    # GIFs et reconstruction VAE en sortie
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
        - path: ./frontend/inference_ui.py
          action: sync+restart
          target: /app/frontend/inference_ui.py
        - path: ./requirements.inference.txt
          action: rebuild
        - path: .env
          action: sync+restart
          target: /app/.env

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: minigrid_dashboard
    volumes:
      - ./runs:/app/runs:ro
    develop:
      watch:
        - path: ./frontend/server.py
          action: sync+restart
          target: /app/frontend/server.py

  nginx:
    build:
      context: ./nginx
    container_name: minigrid_nginx
    ports:
      - "80:80"     # HTTP  → redirige vers HTTPS
      - "443:443"   # HTTPS → https://localhost
    depends_on:
      - dashboard
      - tensorboard
      - inference
