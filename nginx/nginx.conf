upstream dashboard   { server dashboard:8000; }
upstream tensorboard { server tensorboard:6006; }
upstream inference   { server inference:8080; }

# HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Portail unifié
    location = / {
        root /usr/share/nginx/html;
        try_files /portal.html =404;
    }

    # Dashboard FastAPI (SSE : buffering désactivé)
    location /dashboard/ {
        proxy_pass         http://dashboard/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection        '';
        chunked_transfer_encoding on;
        proxy_hide_header  X-Frame-Options;
    }

    # TensorBoard (path_prefix /tensorboard côté serveur)
    location /tensorboard/ {
        proxy_pass         http://tensorboard/tensorboard/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_hide_header  X-Frame-Options;
    }

    # Inference UI FastAPI
    location /inference/ {
        proxy_pass         http://inference/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  X-Frame-Options;
    }
}
