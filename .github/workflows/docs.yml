name: Deploy PyDoc

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # torch CPU-only en CI — pas de GPU sur les runners GitHub
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Dépendances server (gymnasium, minigrid, fastapi, pillow…)
      - name: Install server dependencies
        run: pip install -r requirements.server.txt

      # Dépendances trainer (numpy, requests, tensorboard, pdoc)
      - name: Install trainer dependencies
        run: pip install -r requirements.trainer.txt

      - name: Generate PyDoc HTML
        env:
          PYTHONPATH: src
        run: |
          pdoc \
            src/server.py \
            src/utils.py \
            src/1_collect_data.py \
            src/2_train_world.py \
            src/3_train_controller.py \
            src/models/ \
            --output-dir docs/

      # main → déployé à la racine de GitHub Pages
      - name: Deploy (main → /)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: .
          keep_files: true  # préserve le dossier /dev/ existant

      # dev → déployé dans /dev/ sans écraser la doc de main
      - name: Deploy (dev → /dev/)
        if: github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: dev
          keep_files: true  # préserve la doc de main à la racine
