name: Deploy PyDoc

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # torch CPU-only (~300 Mo) pour éviter le téléchargement CUDA (~2 Go)
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies + pdoc
        run: pip install -r requirements.txt pdoc

      - name: Generate PyDoc HTML
        env:
          PYTHONPATH: src
        run: pdoc src/server.py src/client.py src/model.py --output-dir docs/

      # main → déployé à la racine de GitHub Pages
      - name: Deploy (main → /)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: .
          keep_files: true  # préserve le dossier /dev/ existant

      # dev → déployé dans /dev/ sans écraser la doc de main
      - name: Deploy (dev → /dev/)
        if: github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: dev
          keep_files: true  # préserve la doc de main à la racine
